name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    # GitHub-hosted runner — the suite is fully mocked (no real API calls,
    # no Ollama, no macOS dependency), so no self-hosted machine is needed.
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check src main.py tests

      - name: Type-check (mypy)
        run: mypy src main.py --ignore-missing-imports

      - name: Run tests with coverage
        env:
          # Dummy keys — unit tests mock all HTTP calls
          TELEGRAM_BOT_TOKEN: "dummy"
          OMDB_API_KEY: "dummy"
          WATCHMODE_API_KEY: "dummy"
        run: |
          pytest --cov=src --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-xml
          path: coverage.xml
